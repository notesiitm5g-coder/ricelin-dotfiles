# Ricelin EQ: a WirePlumber smart filter in front of whichever output is the
# default, so apps and the volume keys keep targeting the real device. The pill's
# Music page drives every control at runtime with pw-cli set-param and toggles
# the whole filter through the "filter.smart.disabled" metadata.
#
# Per channel: bass shelf -> 10 peaking bands -> treble shelf, then a 2x2 cross
# mix (mixL/mixR "Gain 1" same side, "Gain 2" other side) that carries the stereo
# widen and the anti-clip preamp. All controls start flat (unity, no widen).
#
# Run by autostart.lua as the ricelin-eq user unit: pipewire -c <this file>

context.properties = {
    log.level = 0
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt
        args = { }
        flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }

    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Ricelin EQ"
            media.name       = "Ricelin EQ"
            filter.graph = {
                nodes = [
                    { type = builtin name = bassL label = bq_lowshelf control = { "Freq" = 100.0 "Q" = 0.7 "Gain" = 0.0 } }
                    { type = builtin name = b1L label = bq_peaking control = { "Freq" = 31.0 "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = b2L label = bq_peaking control = { "Freq" = 62.0 "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = b3L label = bq_peaking control = { "Freq" = 125.0 "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = b4L label = bq_peaking control = { "Freq" = 250.0 "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = b5L label = bq_peaking control = { "Freq" = 500.0 "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = b6L label = bq_peaking control = { "Freq" = 1000.0 "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = b7L label = bq_peaking control = { "Freq" = 2000.0 "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = b8L label = bq_peaking control = { "Freq" = 4000.0 "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = b9L label = bq_peaking control = { "Freq" = 8000.0 "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = b10L label = bq_peaking control = { "Freq" = 16000.0 "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = trebleL label = bq_highshelf control = { "Freq" = 8000.0 "Q" = 0.7 "Gain" = 0.0 } }
                    { type = builtin name = bassR label = bq_lowshelf control = { "Freq" = 100.0 "Q" = 0.7 "Gain" = 0.0 } }
                    { type = builtin name = b1R label = bq_peaking control = { "Freq" = 31.0 "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = b2R label = bq_peaking control = { "Freq" = 62.0 "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = b3R label = bq_peaking control = { "Freq" = 125.0 "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = b4R label = bq_peaking control = { "Freq" = 250.0 "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = b5R label = bq_peaking control = { "Freq" = 500.0 "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = b6R label = bq_peaking control = { "Freq" = 1000.0 "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = b7R label = bq_peaking control = { "Freq" = 2000.0 "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = b8R label = bq_peaking control = { "Freq" = 4000.0 "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = b9R label = bq_peaking control = { "Freq" = 8000.0 "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = b10R label = bq_peaking control = { "Freq" = 16000.0 "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = trebleR label = bq_highshelf control = { "Freq" = 8000.0 "Q" = 0.7 "Gain" = 0.0 } }
                    { type = builtin name = mixL label = mixer control = { "Gain 1" = 1.0 "Gain 2" = 0.0 } }
                    { type = builtin name = mixR label = mixer control = { "Gain 1" = 1.0 "Gain 2" = 0.0 } }
                ]
                links = [
                    { output = "bassL:Out" input = "b1L:In" }
                    { output = "b1L:Out" input = "b2L:In" }
                    { output = "b2L:Out" input = "b3L:In" }
                    { output = "b3L:Out" input = "b4L:In" }
                    { output = "b4L:Out" input = "b5L:In" }
                    { output = "b5L:Out" input = "b6L:In" }
                    { output = "b6L:Out" input = "b7L:In" }
                    { output = "b7L:Out" input = "b8L:In" }
                    { output = "b8L:Out" input = "b9L:In" }
                    { output = "b9L:Out" input = "b10L:In" }
                    { output = "b10L:Out" input = "trebleL:In" }
                    { output = "bassR:Out" input = "b1R:In" }
                    { output = "b1R:Out" input = "b2R:In" }
                    { output = "b2R:Out" input = "b3R:In" }
                    { output = "b3R:Out" input = "b4R:In" }
                    { output = "b4R:Out" input = "b5R:In" }
                    { output = "b5R:Out" input = "b6R:In" }
                    { output = "b6R:Out" input = "b7R:In" }
                    { output = "b7R:Out" input = "b8R:In" }
                    { output = "b8R:Out" input = "b9R:In" }
                    { output = "b9R:Out" input = "b10R:In" }
                    { output = "b10R:Out" input = "trebleR:In" }
                    { output = "trebleL:Out" input = "mixL:In 1" }
                    { output = "trebleR:Out" input = "mixL:In 2" }
                    { output = "trebleR:Out" input = "mixR:In 1" }
                    { output = "trebleL:Out" input = "mixR:In 2" }
                ]
                inputs  = [ "bassL:In" "bassR:In" ]
                outputs = [ "mixL:Out" "mixR:Out" ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name         = "ricelin_eq"
                media.class       = Audio/Sink
                filter.smart      = true
                filter.smart.name = "ricelin-eq"
            }
            playback.props = {
                node.name         = "ricelin_eq.output"
                node.passive      = true
            }
        }
    }
]
